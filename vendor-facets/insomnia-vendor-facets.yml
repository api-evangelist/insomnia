# Vendor facets — Insomnia (Kong). A desktop API client whose collections carry an optional OpenAPI
# spec, Git Sync, cloud or self-hosted mocks and the Inso CLI. Its collection format is not one the
# rubric reads (postman_present is Postman-only and Insomnia has no native Postman export), and it
# hosts nothing public for a provider's docs, so what it can move is conditional: a spec and a ruleset
# the provider authors in it and then publishes, and a mock the provider chooses to expose.
vendor: insomnia
name: Insomnia
website: https://insomnia.rest
areas:
- api-collections
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Insomnia is a tool a provider's team works in, not a surface the score reads. A shared Insomnia collection
  earns nothing: postman_present reads only Postman-typed pointers, and Insomnia exports its own and HAR
  formats, not Postman's. It can help a provider that authors its OpenAPI and custom lint rules in Insomnia
  and publishes them through Git Sync, and a cloud mock can stand in as a sandbox — every one of those
  is conditional on the provider publishing and declaring the result.
features:
- id: collections-with-spec
  name: API Collections with a Spec tab
  description: >-
    Each collection holds requests, environments and an optional OpenAPI (2.0 or later) spec with live
    linting and a rendered preview.
  source: https://developer.konghq.com/insomnia/collections/
  tier: all
- id: spec-linting
  name: Spec linting with custom rulesets (app and inso lint spec)
  description: >-
    Specs are linted in the app and by the Inso CLI; teams can add a YAML file of custom rules beside
    the spec.
  source: https://developer.konghq.com/insomnia/api-specs/
  tier: all
- id: git-sync
  name: Git Sync
  description: Stores project data (collections and specs) in a Git repository.
  source: https://developer.konghq.com/insomnia/
  tier: all
- id: mock-servers
  name: Cloud-hosted and self-hosted mock servers
  description: >-
    Cloud mocks from an endpoint and a sample response, or self-hosted Insomnia Mockbin; requires an account,
    not available in Scratch Pad.
  source: https://developer.konghq.com/insomnia/mock-servers/
  tier: all
- id: inso-cli
  name: Inso CLI
  description: Kong's command-line runner for collections and spec linting in CI/CD.
  source: https://developer.konghq.com/insomnia/collections/
  tier: all
- id: mcp-clients
  name: MCP clients
  description: >-
    Connects to an existing MCP server to invoke and inspect its tools, prompts and resources; Insomnia
    neither generates nor hosts servers.
  source: https://developer.konghq.com/insomnia/mcp-clients-in-insomnia/
  tier: all
maps:
- feature: collections-with-spec
  check: contract_present
  layer: composite
  conditional: true
  condition: >-
    Only if the provider authors its OpenAPI in Insomnia and publishes it (Git Sync to a public repo or
    its own site) — Insomnia is the editor, the contract is the provider's to publish.
  provider_must: Publish the spec where the provider controls it and register it in apis.yml.
  catalog_pass_rate: 0.31
  facet: contract_quality
  points: 20
  baseline_pass_rate: 0.949
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: spec-linting
  check: rules_present
  layer: composite
  conditional: true
  condition: >-
    Only if the team writes custom rules and publishes the ruleset file in a public repository the catalog
    reads — the built-in linting publishes nothing.
  catalog_pass_rate: 0.006
  facet: contract_governance
  points: 10
  baseline_pass_rate: 0.063
- feature: mock-servers
  check: console_or_sandbox
  layer: composite
  conditional: true
  condition: >-
    Only if the provider exposes a mock publicly and declares it as Sandbox; the mock returns the sample
    responses someone typed, not the API's behavior.
  catalog_pass_rate: 0.089
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.332
earns_nothing:
- feature: collections-with-spec
  check: postman_present
  why: >-
    The check reads Postman-typed pointers only. Insomnia exports its own and HAR formats; a shared Insomnia
    collection is not a Postman collection and declaring it as one would be mislabeling.
- feature: inso-cli
  check: cli_present
  why: >-
    Inso is Kong's CLI for running collections and linting; it is not a command-line client for the provider's
    API.
- feature: mcp-clients
  check: mcp_server
  layer: agent_readiness
  why: Insomnia is an MCP client for testing servers others run; it creates no server for the provider.
out_of_reach:
  checks:
  - documentation_present
  - llms_txt_published
  - sdk_count_1
  - agent_skill_present
  - examples_published
  note: >-
    Nothing on the fetched pages publishes hosted docs, an llms.txt, an SDK, an Agent Skill or an example
    corpus on the provider's surface; the spec preview renders inside the app only.
unscored_practice:
- feature: collections-with-spec
  why: >-
    Git-stored Insomnia collections are a real runnable artifact some providers publish; no check reads
    a non-Postman collection format.
surface:
  contract_quality:
    reachable: 20.0
    total: 211
  contract_governance:
    reachable: 10.0
    total: 33
  developer_ergonomics:
    reachable: 3.0
    total: 42
  agent_readiness:
    reachable: 0
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
method: searched
